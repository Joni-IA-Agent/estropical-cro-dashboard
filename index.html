<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Estropical · Dashboard CRO</title>
<style>
  :root{ --blue:#0047ba; --blue2:#2d38d6; --ink:#0b1020; --muted:#6b7280; --bg:#f4f6fb; --card:#ffffff; --err:#dc2626; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        background:radial-gradient(1200px 600px at 50% -10%, #e7ecfb 0%, var(--bg) 55%); color:var(--ink);
        display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
  .card{ width:100%; max-width:400px; background:var(--card); border-radius:18px; padding:36px 32px 32px;
         box-shadow:0 20px 60px rgba(11,16,32,.12), 0 2px 8px rgba(11,16,32,.06); }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .dot{ width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,var(--blue),var(--blue2));
        display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:18px; }
  h1{ font-size:19px; margin:0; letter-spacing:-.2px; }
  .sub{ color:var(--muted); font-size:13px; margin:2px 0 26px; }
  label{ display:block; font-size:12.5px; font-weight:600; color:#374151; margin:0 0 6px 2px; }
  .field{ margin-bottom:16px; }
  input{ width:100%; padding:12px 14px; font-size:15px; border:1.5px solid #e5e7eb; border-radius:11px;
         background:#fbfcfe; transition:border-color .15s, box-shadow .15s; outline:none; }
  input:focus{ border-color:var(--blue2); box-shadow:0 0 0 3px rgba(45,56,214,.12); background:#fff; }
  button{ width:100%; margin-top:8px; padding:13px; font-size:15px; font-weight:700; color:#fff; cursor:pointer;
          border:0; border-radius:11px; background:linear-gradient(135deg,var(--blue),var(--blue2));
          transition:transform .06s, filter .15s; }
  button:hover{ filter:brightness(1.05); }
  button:active{ transform:translateY(1px); }
  button:disabled{ opacity:.6; cursor:progress; }
  .err{ color:var(--err); font-size:13px; margin:14px 2px 0; min-height:18px; }
  .foot{ text-align:center; color:#9aa1ac; font-size:11.5px; margin-top:22px; }
  .lock{ font-size:12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><div class="dot">E</div><h1>Estropical · Dashboard CRO</h1></div>
    <p class="sub">Acceso restringido. Introduce tus credenciales.</p>
    <form id="f" autocomplete="off">
      <div class="field">
        <label for="u">Usuario</label>
        <input id="u" type="text" autocapitalize="none" autocomplete="username" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="p">Contraseña</label>
        <input id="p" type="password" autocomplete="current-password" required>
      </div>
      <button id="btn" type="submit">Entrar</button>
      <div class="err" id="err"></div>
    </form>
    <div class="foot"><span class="lock">🔒</span> Contenido cifrado AES-256 · uConvert Marketing</div>
  </div>

  var SALT    = "Utg7ggkpNgTzEN2RhPYa9w==";
  var IV      = "7gZg0UdV/vtwBTfT";
  var ITER    = 250000;

  function b64ToBytes(b64){
    var bin = atob(b64), len = bin.length, out = new Uint8Array(len);
    for (var i=0;i<len;i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function decrypt(user, pass){
    var enc = new TextEncoder();
    var baseKey = await crypto.subtle.importKey(
      "raw", enc.encode(user + ":" + pass), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name:"PBKDF2", salt:b64ToBytes(SALT), iterations:ITER, hash:"SHA-256" },
      baseKey, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    var buf = await crypto.subtle.decrypt(
      { name:"AES-GCM", iv:b64ToBytes(IV) }, key, b64ToBytes(PAYLOAD));
    return new TextDecoder().decode(buf);
  }

  var form = document.getElementById("f"),
      btn  = document.getElementById("btn"),
      err  = document.getElementById("err");

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    err.textContent = "";
    btn.disabled = true; btn.textContent = "Descifrando…";
    var u = document.getElementById("u").value.trim();
    var p = document.getElementById("p").value;
    try{
      var html = await decrypt(u, p);
      document.open(); document.write(html); document.close();
    }catch(ex){
      err.textContent = "Usuario o contraseña incorrectos.";
      btn.disabled = false; btn.textContent = "Entrar";
      document.getElementById("p").value = "";
    }
  });
